<svg xmlns="http://www.w3.org/2000/svg" width="495" height="336" viewBox="0 0 495 336" role="img">
  <title>Топ репозиториев</title>
  <style>
    .bg { fill: #0d1117; stroke: #3d444d; }
    .ln { stroke: #3d444d; }
    .h { font: 600 18px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #4493f8; }
    .k { font: 400 14px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .v { font: 600 14px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .big { font: 600 28px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .cap { font: 600 13px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #4493f8; }
    .sub { font: 400 11px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .l0 { fill: #151b23; } .l1 { fill: #033a16; } .l2 { fill: #196c2e; } .l3 { fill: #2ea043; } .l4 { fill: #56d364; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; stroke: #d1d9e0; }
      .ln { stroke: #d1d9e0; }
      .h, .cap { fill: #0969da; }
      .k, .sub { fill: #59636e; }
      .v, .big { fill: #1f2328; }
      .l0 { fill: #eff2f5; } .l1 { fill: #aceebb; } .l2 { fill: #4ac26b; } .l3 { fill: #2da44e; } .l4 { fill: #116329; }
    }
    .f { animation: f .4s ease-in-out backwards; }
    @keyframes f { from { opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" rx="6" width="494" height="335" class="bg"/>
  <text class="h" x="25" y="38">Топ репозиториев</text>
  <g class="f" style="animation-delay:150ms" transform="translate(25, 72)">
    <text class="v" x="0" y="0">AlKAsH3D-Engine</text>
    <text class="sub" x="0" y="17">Движок для 3D RTX-игр на Rust (+Python)</text>
    <circle cx="340" cy="-4" r="5" fill="#dea584"/><text class="sub" x="350" y="0">Rust</text>
    <text class="cap" x="445" y="0" text-anchor="end">★ 2</text>
  </g>
  <g class="f" style="animation-delay:250ms" transform="translate(25, 116)">
    <text class="v" x="0" y="0">Desktop-ponies-2-</text>
    <text class="sub" x="0" y="17">Desktop Ponies на Rust</text>
    <circle cx="340" cy="-4" r="5" fill="#dea584"/><text class="sub" x="350" y="0">Rust</text>
    <text class="cap" x="445" y="0" text-anchor="end">★ 2</text>
  </g>
  <g class="f" style="animation-delay:350ms" transform="translate(25, 160)">
    <text class="v" x="0" y="0">claude-animate</text>
    <text class="sub" x="0" y="17">Плагин Claude Code для работы в Adobe Animate</text>
    <circle cx="340" cy="-4" r="5" fill="#3572A5"/><text class="sub" x="350" y="0">Python</text>
    <text class="cap" x="445" y="0" text-anchor="end">★ 1</text>
  </g>
  <g class="f" style="animation-delay:450ms" transform="translate(25, 204)">
    <text class="v" x="0" y="0">OSI-X</text>
    <text class="sub" x="0" y="17">Прошивка самодельного 3D-принтера на ESP32-S3</text>
    <circle cx="340" cy="-4" r="5" fill="#dea584"/><text class="sub" x="350" y="0">Rust</text>
    <text class="cap" x="445" y="0" text-anchor="end">★ 1</text>
  </g>
  <g class="f" style="animation-delay:550ms" transform="translate(25, 248)">
    <text class="v" x="0" y="0">MAX-Messenger-</text>
    <text class="sub" x="0" y="17">это открытый код того самого абсурдного мессенджера (код мож…</text>
    <circle cx="340" cy="-4" r="5" fill="#b07219"/><text class="sub" x="350" y="0">Java</text>
    <text class="cap" x="445" y="0" text-anchor="end">★ 1</text>
  </g>
  <g class="f" style="animation-delay:650ms" transform="translate(25, 292)">
    <text class="v" x="0" y="0">site-AlKAsH3D-</text>
    <text class="sub" x="0" y="17"></text>
    <circle cx="340" cy="-4" r="5" fill="#f1e05a"/><text class="sub" x="350" y="0">JavaScript</text>
    <text class="cap" x="445" y="0" text-anchor="end">★ 0</text>
  </g>
</svg>
