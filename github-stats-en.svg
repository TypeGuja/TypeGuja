<svg xmlns="http://www.w3.org/2000/svg" width="495" height="250" viewBox="0 0 495 250" role="img">
  <title>GitHub Stats — TypeGuja</title>
  <style>
    .bg { fill: #0d1117; stroke: #3d444d; }
    .ln { stroke: #3d444d; }
    .h { font: 600 18px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #4493f8; }
    .k { font: 400 14px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .v { font: 600 14px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .big { font: 600 28px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .cap { font: 600 13px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #4493f8; }
    .sub { font: 400 11px -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .l0 { fill: #151b23; } .l1 { fill: #033a16; } .l2 { fill: #196c2e; } .l3 { fill: #2ea043; } .l4 { fill: #56d364; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; stroke: #d1d9e0; }
      .ln { stroke: #d1d9e0; }
      .h, .cap { fill: #0969da; }
      .k, .sub { fill: #59636e; }
      .v, .big { fill: #1f2328; }
      .l0 { fill: #eff2f5; } .l1 { fill: #aceebb; } .l2 { fill: #4ac26b; } .l3 { fill: #2da44e; } .l4 { fill: #116329; }
    }
    .f { animation: f .4s ease-in-out backwards; }
    @keyframes f { from { opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" rx="6" width="494" height="249" class="bg"/>
  <text class="h" x="25" y="38">GitHub Stats — TypeGuja</text>
    <g class="f" style="animation-delay:150ms" transform="translate(25, 70)">
      <text class="k" x="0" y="0">Stars earned:</text>
      <text class="v" x="300" y="0">7</text>
    </g>
    <g class="f" style="animation-delay:270ms" transform="translate(25, 98)">
      <text class="k" x="0" y="0">Total commits:</text>
      <text class="v" x="300" y="0">1067</text>
    </g>
    <g class="f" style="animation-delay:390ms" transform="translate(25, 126)">
      <text class="k" x="0" y="0">Contributions (30 days):</text>
      <text class="v" x="300" y="0">60</text>
    </g>
    <g class="f" style="animation-delay:510ms" transform="translate(25, 154)">
      <text class="k" x="0" y="0">Pull requests:</text>
      <text class="v" x="300" y="0">5</text>
    </g>
    <g class="f" style="animation-delay:630ms" transform="translate(25, 182)">
      <text class="k" x="0" y="0">Issues:</text>
      <text class="v" x="300" y="0">5</text>
    </g>
    <g class="f" style="animation-delay:750ms" transform="translate(25, 210)">
      <text class="k" x="0" y="0">Public repositories:</text>
      <text class="v" x="300" y="0">15</text>
    </g>
</svg>
